name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22.18+ runs the TypeScript sources natively (the published package is compiled JavaScript).
        # setup-node resolves the latest release of each line.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Pack the library, install it into a fresh project and use it (JavaScript, TypeScript, CLI).
      - run: npm run check:package

  entrypoint-simulations:
    # src/entrypoint-simulations.ts is generated: check that it is what its pinned sources compile to.
    name: EntryPoint simulation code is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The packages and compilers (npm) and EntryPoint v0.9's verified sources (Sourcify), each checked against its
      # pinned hash; cached so that a later run needs neither service.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/entrypoint-sources
          key: entrypoint-sources-${{ hashFiles('scripts/build-entrypoint-simulations.ts') }}
      - run: npm run build:entrypoints -- --check --cache ~/.cache/entrypoint-sources

  b20-reference:
    # src/b20-reference.ts is generated: check that it is what its sources (vendor/base-std, checked against their
    # pinned hash) compile to with this repository's solc. No network needed.
    name: B20 reference code is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:b20 -- --check
